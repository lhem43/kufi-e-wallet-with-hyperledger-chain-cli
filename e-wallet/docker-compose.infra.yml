services:
  postgres:
    image: postgres:16-alpine
    container_name: ewallet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${E_WALLET_DB_USER}
      POSTGRES_PASSWORD: ${E_WALLET_DB_PASS}
      POSTGRES_DB: ${E_WALLET_DB_NAME}
    ports:
      - '5432:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${E_WALLET_DB_USER} -d ${E_WALLET_DB_NAME}',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ewallet_postgres_data:/var/lib/postgresql/data

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.14
    container_name: ewallet-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - '1'
      - --memory
      - '1G'
      - --reserve-memory
      - '0M'
      - --node-id
      - '0'
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092,OUTSIDE://localhost:9092
    ports:
      - '9092:19092'
      - '9644:9644'
    healthcheck:
      test: ['CMD-SHELL', 'rpk cluster health | grep -q Healthy']
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  ewallet_postgres_data:
